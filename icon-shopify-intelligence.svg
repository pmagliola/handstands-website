<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="#ECFDF5"/>

  <!-- Shopping bag body -->
  <rect x="52" y="80" width="72" height="60" rx="8" fill="none" stroke="#059669" stroke-width="8" stroke-linejoin="round"/>

  <!-- Bag handle -->
  <path d="M72 80 C72 60 120 60 120 80" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round"/>

  <!-- Magnifying glass circle -->
  <circle cx="124" cy="64" r="20" fill="white" stroke="#0F172A" stroke-width="7"/>

  <!-- Magnifying glass handle -->
  <line x1="138" y1="78" x2="152" y2="92" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <!-- Chart bars inside bag -->
  <rect x="66" y="112" width="10" height="16" rx="2" fill="#059669" opacity="0.5"/>
  <rect x="82" y="104" width="10" height="24" rx="2" fill="#059669" opacity="0.7"/>
  <rect x="98" y="96" width="10" height="32" rx="2" fill="#059669"/>

